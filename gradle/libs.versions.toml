[versions]
accompanist = "0.36.0"
agp = "9.2.0"
androidTestSupport = "1.7.0"
coil = "3.5.0"
compose = "1.11.4"
composeIcons = "1.7.8"
composeMaterial3 = "1.4.0"
coroutines = "1.11.0"
espresso = "3.7.0"
kotlin = "2.4.10"
ksp = "2.3.10"
lifecycle = "2.10.0"
room = "2.8.4"
metro = "1.4.0"

[plugins]
agp = { id = "com.android.tools.build:gradle", version.ref = "agp" }
agp-application = { id = "com.android.application", version.ref = "agp" }
agp-library = { id = "com.android.library", version.ref = "agp" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp"}
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-window = "androidx.window:window:1.5.1"

androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
androidx-compose-material3-core = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
androidx-compose-material3-windowSizeClass = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "composeMaterial3" }
androidx-compose-materialIcons = { module = "androidx.compose.material:material-icons-core", version.ref = "composeIcons" }
androidx-compose-materialIconsExtended = { module = "androidx.compose.material:material-icons-extended", version.ref = "composeIcons" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-uiTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-uiTest = { module = "androidx.compose.ui:ui-test", version.ref = "compose" }
androidx-compose-accompantist-systemUi = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist" }

androidx-core = "androidx.core:core-ktx:1.19.0"
androidx-datastore = "androidx.datastore:datastore-preferences:1.2.1"
androidx-lifecycle-extensions = "androidx.lifecycle:lifecycle-extensions:2.2.0"
androidx-lifecycle-runtimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-navigation-compose = "androidx.navigation:navigation-compose:2.9.8"
androidx-palette = "androidx.palette:palette:1.0.0"

androidx-room-apt = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

google-material = "com.google.android.material:material:1.13.0"

kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }

misc-processPhoenix = "com.jakewharton:process-phoenix:3.0.0"
misc-timber = "com.jakewharton.timber:timber:5.0.1"
okhttp-core = "com.squareup.okhttp3:okhttp:5.4.0"


test-android-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
test-android-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
test-android-espresso-web = { module = "androidx.test.espresso:espresso-web", version.ref = "espresso" }
test-android-runner = { module = "androidx.test:runner", version.ref = "androidTestSupport" }
test-android-rules = { module = "androidx.test:rules", version.ref = "androidTestSupport" }

test-junit = "junit:junit:4.13.2"
test-truth = "com.google.truth:truth:1.4.5"
